<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="10">
    <title>Open MailMan — Deploying</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 28rem;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            animation: pulse 2s ease-in-out infinite;
        }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }
        p { color: #94a3b8; line-height: 1.6; }
        .bar {
            margin-top: 2rem;
            height: 4px;
            background: #1e293b;
            border-radius: 2px;
            overflow: hidden;
        }
        .bar::after {
            content: "";
            display: block;
            height: 100%;
            width: 40%;
            background: #38bdf8;
            border-radius: 2px;
            animation: slide 1.4s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📮</div>
        <h1>We'll be right back</h1>
        <p>Open MailMan is deploying a new version. This page refreshes automatically — you'll be back in under a minute.</p>
        <div class="bar"></div>
    </div>
</body>
</html>
