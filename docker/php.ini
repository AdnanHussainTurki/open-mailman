memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
expose_php = Off
display_errors = Off
log_errors = On

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=0

[Session]
; PHP2Shell (CVE-2026-109619) mitigation: the upload-progress hook is the
; pre-application RCE path. Nothing here uses it (Laravel sessions are not
; native PHP sessions). Keep it off even after the base reaches a patched PHP.
session.upload_progress.enabled = 0
